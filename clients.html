<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients</title>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/clients.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="main-container">
        <div id="sidebar-container"></div>
        <div class="content-container">
          <div id="header-container"></div>
    
          <section class="dashboard-intro">
            <div class="top">
              <h1 class="title">Clients</h1>
              <button id="new-project-btn">+ New Clients</button>
            </div>
            <p class="subtitle">Manage your client relationships and contacts</p>
          </section>
    
      <main class="dashboard-content" id="dashboard-content">
        <div class="search-bar">
          <img src="icons-menu/search-color.svg" alt="Search" />
          <input type="text" placeholder="Search projects..." />
        </div>
        <div class="client-card">
          <div class="client-header">
            <h2 class="client-name">Client Name</h2>
            <div class="status-area">
              <button class="status-btn">Status</button>
              <button class="menu-btn">
                <img src="./icons-menu/3Dots.png" alt="menu icon">
              </button>

              <!-- 
              <div class="status-dropdown">
                  <div class="status-option active">Active</div>
                  <div class="status-option inactive">Inactive</div>
                  <div class="status-option done">Done</div>
              </div>
          
              
              <div class="menu-dropdown">
                  <div class="menu-option delete">Delete</div>
              </div> -->
            </div>
          </div>
          <div class="client-content">
            <div class="client-contact-info">
        
              <div class="info-item">
                <img src="./icons-menu/Organization-color.svg" class="info-icon" alt="">
                <p>Company name</p>
              </div>
              <div class="info-item">
                <img src="./icons-menu/Letter.png" class="info-icon" alt="">
                <p>Client email</p>
              </div>
              <div class="info-item">
                <img src="./icons-menu/Phone.png" class="info-icon" alt="">
                <p>Client phone</p>
              </div>
        
            </div>
            <hr>
            <div class="client-project-stats">
        
              <div class="stats-row">
                <span>Projects:</span>
                <span class="projects_number">3</span>
              </div>
              <div class="stats-row">
                <span>Total value:</span>
                <span class="value">$10,000</span>
              </div>
        
            </div>
          </div>
          <div class="card-buttons">
            <button class="btn-contact">Contact</button>
            <button class="btn-view-projects">View Projects</button>
          </div>
        </div>
      </main>
    </div>
    
  </div> 
    
    <script src="scripts/sidebar.js"></script>
    <script src="scripts/header.js"></script>
</body>
</html>

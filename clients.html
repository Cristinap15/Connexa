<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients</title>
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/clients.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="main-container">
        <div id="sidebar-container"></div>
        <div class="content-container">
          <div id="header-container"></div>
    
          <section class="dashboard-intro">
            <div class="top">
              <h1 class="title">Clients</h1>
              <button id="new-project-btn">+ New Client</button>
            </div>
            <p class="subtitle">Manage your client relationships and contacts</p>
          </section>
    
      <main class="dashboard-content" id="dashboard-content">
        <div class="search-bar">
          <img src="icons-menu/search-color.svg" alt="Search" />
          <input id="clients-search" type="text" placeholder="Search clients..." />
        </div>
        <div id="clients-grid" class="clients-grid"></div>
      </main>
    </div>
    
  </div> 

    <div id="clientFormPopup" class="popup-overlay">
      <div class="popup-content">
        <div class="header">
          <h2>New Client</h2>
          <span class="close-btn" id="closeClientPopup">
            <img src="./icons-menu/Cancel.png" alt="close">
          </span>
        </div>

        <hr>

        <form id="newClientForm">

          <!-- Row 1 -->
          <div class="form-row">
            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" name="full_name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
              <label>Company Name *</label>
              <input type="text" name="company_name" placeholder="Company Name Inc." required>
            </div>
          </div>

          <!-- Row 2 -->
          <div class="form-row">
            <div class="form-group">
              <label>Email Address *</label>
              <input type="email" name="email" placeholder="john.company.com" required>
            </div>

            <div class="form-group">
              <label>Phone Number *</label>
              <input type="text" name="phone" placeholder="+1 234 567 8900" required>
            </div>
          </div>

          <!-- Address -->
          <div class="form-group full-width">
            <label>Address</label>
            <input type="text" name="address" placeholder="123 Main St, City, State 12345">
          </div>

          <!-- Notes -->
          <div class="form-group full-width">
            <label>Notes</label>
            <textarea name="notes" placeholder="Additional notes about the client"></textarea>
          </div>

          <!-- Status -->
          <div class="form-group full-width">
            <label>Status</label>
            <select name="status">
              <option value="" disabled selected>Select status</option>
              <option value="Active">Active</option>
              <option value="Pending">Pending</option>
              <option value="Archived">Archived</option>
            </select>
          </div>

          <!-- Buttons -->
          <div class="form-buttons">
            <button type="button" id="cancelClientBtn" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-create">Add Client</button>
          </div>

        </form>
      </div>
    </div>
  
    <script src="scripts/clients.js"></script>
    <script src="scripts/sidebar.js"></script>
    <script src="scripts/header.js"></script>
</body>
</html>

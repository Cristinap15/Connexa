<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | Connexa</title>
  <link rel="stylesheet" href="./styles/global.css" />
  <link rel="stylesheet" href="./styles/welcome.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gluten:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/register.css">
</head>

<body>
  <div class="logo">
    <div class="conexa">Connexa</div>
  </div>

  <div class="register-wrapper">
    <h1>Log In</h1>
    <p class="subtitle">Welcome back to Connexa</p>

    <div class="social-buttons">
      <button class="social-btn">
        <img src="icons-menu/apple.png" alt="Apple">
        Continue with Apple
      </button>
      <button class="social-btn">
        <img src="icons-menu/google.png" alt="Google">
        Continue with Google
      </button>
    </div>

    <div class="separator">or</div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="********" required>

      <div class="form-footer">
        <label class="remember">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a class="forgot" href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <p class="login-text">Don’t have an account? <a href="register.html">Create one</a></p>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = Object.fromEntries(new FormData(loginForm).entries());
        try {
          const res = await fetch('data/auth_login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const text = await res.text();
          let json = null;
          try { json = text ? JSON.parse(text) : null; } catch (_) {}
          if (!res.ok || (json && json.error)) {
            const msg = json ? (json.error || json.details) : text || `HTTP ${res.status}`;
            throw new Error(msg);
          }
          window.location.href = 'dashboard.html';
        } catch (err) {
          alert('Failed to log in. ' + (err && err.message ? err.message : ''));
        }
      });
    }
  </script>
</body>
</html>
